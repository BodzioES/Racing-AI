# Nginx reverse proxy dla racing-ai.kuncrog.com
# Wgraj na VPS jako: /etc/nginx/sites-available/racing-ai.kuncrog.com
# potem: ln -s ... /etc/nginx/sites-enabled/ + certbot --nginx
#
# Aplikacja (docker compose) slucha na 127.0.0.1:8000 - ten plik
# przekazuje tam caly ruch HTTP + WebSocket (/ws).
#
# Wymaga: DNS A racing-ai.kuncrog.com -> IP Twojego VPS (masz juz w OVH).

# 1) HTTP -> przekierowanie na HTTPS (Certbot dopisze certyfikaty tutaj
#    automatycznie, albo odkomentuj redirect recznie).
server {
    listen 80;
    server_name racing-ai.kuncrog.com;

    # Umozliwia Certbotowi weryfikacje HTTP-01:
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Po wydaniu certa przez Certbota zamien na redirect:
        # return 301 https://$host$request_uri;

        # Przed wydaniem certa (zeby strona dzialala od razu po deployu):
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

